{
	"type": "Coverity configuration",
	"format_version": 1,
	"variables": {
		// The coverity project. It identifies the library, or part of the library, this unit is part of.
		// TODO: change to the proper name
		"project"       : "UnitTest_INVALID",

		// Name of the unit (plus test flavor, if supported)
		// For each coverity project, there will be several streams for each unit inside that project.
		// The stream name is the project + "_" + unit
		// TODO: change the the proper name
		"unit"          : "INVALID",
		
		// Do not change. All unit tests use the same component map.
		"component_map" : "UnitTestMut",
		
		// Analysis options. Change only, if you are using a special environment in this test.
		"analysis_args"                : "--concurrency --security --enable-parse-warnings --rule --enable-constraint-fpp --disable-fb",
		"analysis_user_model"          : "$(code_base_dir)/build/CoverityPlatform/user_models.c",
		"analysis_coding_standard"     : "$(code_base_dir)/build/CoverityPlatform/Rules/ask-misra-c-2012-with-his.config",
		"analysis_severity_map"        : "$(code_base_dir)/build/CoverityPlatform/Rules/severity_map.json",
		"analysis_cxm_checker"         : "$(code_base_dir)/build/CoverityPlatform/Rules/buzzword_filter.cxm",
		"analysis_auto_create_stream"  : "true",
		"analysis_auto_assign"         : "true",

		// We want to filter out any defects, not belonging to module under test.
		"analysis_filter_idir": "true",
		
		// Do not change. Subsequent scripts will rely on the report being in this exact location.
		"report_filename"   : "$(code_base_dir)/reports/Sca.html",
		
		// Do not change. Only ASK Source Code is subject to unit testing.
		"report_components" : "'ASK Source Code'"
	},
	"settings": {
		// Do not change. These settings should apply to all unit tests.
		"stream": "$(var:project)_$(var:unit)",
		"compiler_config_file": "$(code_base_dir)/build/CoverityPlatform/coverity_config.xml",
		"server": {
			"host": "DESRVICT31",
			"port": 80
		},
		"intermediate_dir": "$(code_base_dir)\\obj\\coverity\\idir",
		"cov_run_desktop": {
			"build_cmd": ["make", "-j12", "coverity"],
			"clean_cmd": ["make", "clean"],
			"analysis_args": []
		},
		"ide": {
			"build_strategy": "CUSTOM",
			"path_mapping": {
				"search_paths": [
					"$(code_base_dir)"
				]
			}
		},
		"scm": {
			"scm": "svn",
			"tool": "C:\\devbin\\svnclient\\v1.8.9\\bin\\svn.exe",
			"project_root": "$(code_base_dir)"
		}
	}
}