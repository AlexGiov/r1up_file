<!--
This is an html that contains data in the form of pure xml section (html/body/script[@id="xmlData"]/data). 
In order to be parseable by any XML parser, it is formatted in a way that satisfies both html and xml.
For some reason unknown to me, there is a lot of confusion about xml conformant html. The old xhtml declaration
is nowadays completely ignored by browsers. They will always parse as html5.
So the only way to pull this off is by a couple of nasty tricks:
* xml section is hidden to the html parser by declaring it as type="text/xmldata"
* xml section is then accessed as text and parsed by the javascript code
* The javascript code must be embedded in CDATA section, for beeing readable by xml parsers.
  At the same time the CDATA declaration must be commented out, to be hidden from the html/javascript parser.
-->

// Select sub xml element by path
function jsSelect(element, path)
{
	if (path.length == 0)
	{
		return element;
	}

	// select the element of path[0]
	var child = null;
	
	var childNodes = element.childNodes;
	var childNodesLen = childNodes.length;
	for (var a=0; a<childNodesLen; a++)
	{
		if (childNodes[a].nodeName == path[0])
		{
			child = childNodes[a];
			break;
		}
	}
	
	if (child == null)
	{
		return child;
	}
	else
	{
		path.shift();
		return jsSelect(child, path);
	}
}

function jsSelectText(element, path)
{
	// Assume that last element is an attribute
	var attrib = null;
	
	if (path.length > 0)
	{
		attrib = path.pop();
		if (attrib.startsWith("@"))
		{
			attrib = attrib.slice(1);
		}
		else
		{
			// Last element is not an attribute, re-add it to the array
			path.push(attrib);
			attrib = null;
		}
	}

	// Find xml element	
	var elSel = jsSelect(element, path);
	
	var ret = null;
	if (attrib===null)
	{
		ret = elSel.textContent;
	}
	else
	{
		ret = elSel.getAttribute(attrib);
	}

	return ret;
}


// Apply xml content to dst id.
function jsApplyText(element, id, text)
{
	var el_dst;
	if (element === null)
	{
		elSel = document.getElementById(id);
	}
	else
	{
		elSel = element.querySelector("#"+id);
	}

	elSel.innerHTML = text;
}


// Apply xml content to dst id.
// src: xml source element
// path: path to sub-element
// dst: id of destination html element
// percent: Add % for valid numbers in case of true
function jsApplySelect(srcEl, srcPath, dstEl, dstId)
{
	var text = jsSelectText(srcEl, srcPath);
	jsApplyText(dstEl, dstId, text);
	return text;
}



function jsApplyAttrib(srcEl, srcPath, srcAttrib, dstEl, dstId)
{
	var srcElSel = jsSelect(srcEl, srcPath);
	
	var el_dst;
	if (dstEl === null)
	{
		dstElSel = document.getElementById(dstId);
	}
	else
	{
		dstElSel = dstEl.querySelector("#"+dstId);
	}
	dstElSel.innerHTML = srcElSel.getAttribute(srcAttrib);
	return srcElSel.textContent;
}


function jsPercent(value)
{
	if (isNaN(value))
	{
		return value;
	}
	else
	{
		return value+"%";
	}
}

// Init details for single unit test (dropdown)
function jsInitDetails(detailsData, detailsHtml)
{
	var htmlDtlsContMetadataTable = detailsHtml.querySelector("#DtlsContMetadataTable");
	var htmlDtlsTplMetadataRow = detailsHtml.querySelector("#DtlsTplMetadataRow");
	
	var htmlDtlsContMinCoverageC0 = detailsHtml.querySelector("#DtlsContMinCoverageC0");
	var htmlDtlsContMinCoverageC1 = detailsHtml.querySelector("#DtlsContMinCoverageC1");
	var htmlDtlsContMinCoverageC1P = detailsHtml.querySelector("#DtlsContMinCoverageC1P");
	var htmlDtlsContMinCoverageJust = detailsHtml.querySelector("#DtlsContMinCoverageJust");

	var htmlDtlsTplTestCase = detailsHtml.querySelector("#DtlsTplTestCase");
	var htmlDtlsContTestCases = detailsHtml.querySelector("#DtlsContTestCases");

	var htmlDtlsContFiles = detailsHtml.querySelector("#DtlsContFiles");
	var htmlDtlsTplFile   = detailsHtml.querySelector("#DtlsTplFile");
	
	var supportedC0  = true;
	var supportedC1  = true;
	var supportedC1P = true;
	
	var x;
	
	for (var xmlDataChild=detailsData.firstChild; xmlDataChild!==null; xmlDataChild=xmlDataChild.nextSibling)
	{
		if (xmlDataChild.nodeName == "metadata")
		{
			for (var xmlMetadataEntry=xmlDataChild.firstChild; xmlMetadataEntry!==null; xmlMetadataEntry=xmlMetadataEntry.nextSibling)
			{
				if (xmlMetadataEntry.nodeName == "entry")
				{
					var htmlContMetadataRow = htmlDtlsTplMetadataRow.cloneNode(true);
					htmlContMetadataRow.style.display = null;
					htmlContMetadataRow.querySelector('#DtlsContMetadataName').innerText = xmlMetadataEntry.getAttribute("name");
					htmlContMetadataRow.querySelector('#DtlsContMetadataValue').innerText = xmlMetadataEntry.textContent;
					htmlDtlsContMetadataTable.appendChild(htmlContMetadataRow);
				}
			}
		}
		
		if (xmlDataChild.nodeName == "min_coverage")
		{
			var minC0 = xmlDataChild.getAttribute("c0");
			if ( isNaN(minC0) )
			{
				supportedC0 = false;
			}
			else
			{
				minC0 = minC0 + "%";
			}
			htmlDtlsContMinCoverageC0.innerText = minC0;

			var minC1 = xmlDataChild.getAttribute("c1");
			if ( isNaN(minC1) )
			{
				supportedC1 = false;
			}
			else
			{
				minC1 = minC1 + "%";
			}
			htmlDtlsContMinCoverageC1.innerText = minC1;

			var minC1P = xmlDataChild.getAttribute("c1p");
			if ( isNaN(minC1P) )
			{
				supportedC1P = false;
			}
			else
			{
				minC1P = minC1P + "%";
			}
			htmlDtlsContMinCoverageC1P.innerText = minC1P;

			htmlDtlsContMinCoverageJust.innerText = xmlDataChild.textContent;
		}
		

		if (xmlDataChild.nodeName == "summary")
		{
			var summaryResult = jsSelectText(xmlDataChild, ["result"]);

			if (['failed_build','not_relevant','missing','invalid'].includes(summaryResult))
			{
				supportedC0 = false;
				supportedC1 = false;
				supportedC1P = false;
			}
		
			jsApplyText(detailsHtml, "DtlsContSummaryResult", resultMap[summaryResult]);

			jsApplySelect(xmlDataChild, ["testcases","@total"], detailsHtml, "DtlsContSummaryTcTotal");
			jsApplySelect(xmlDataChild, ["testcases","@passed"], detailsHtml, "DtlsContSummaryTcPassed");
			jsApplySelect(xmlDataChild, ["testcases","@failed"], detailsHtml, "DtlsContSummaryTcFailed");
			
			var xmlCoverage = jsSelect(xmlDataChild, ["coverage"])

			if (supportedC0)
			{
				x = jsSelectText(xmlCoverage, ["@c0"])
				if (x == "none")
				{
					x = notAvailable;
				}
				else
				{
					x = jsPercent(x) + ' (' + jsSelectText(xmlCoverage, ["@lines_exec"]) + '/' + jsSelectText(xmlCoverage, ["@lines_total"]) + ')';
				}
				jsApplyText(detailsHtml, "DtlsContSummaryCoverageC0", x);
			}
			else
			{
				detailsHtml.querySelector("#DtlsContSummaryCoverageTrC0").style.display = "none";
			}

			if (supportedC1)
			{
				x = jsSelectText(xmlCoverage, ["@c1"])
				if (x == "none")
				{
					x = notAvailable;
				}
				else
				{
					x = jsPercent(x) + ' (' + jsSelectText(xmlCoverage, ["@branches_c1_exec"]) + '/' + jsSelectText(xmlCoverage, ["@branches_c1_total"]) + ')';
				}
				jsApplyText(detailsHtml, "DtlsContSummaryCoverageC1", x);
			}
			else
			{
				detailsHtml.querySelector("#DtlsContSummaryCoverageTrC1").style.display = "none";
			}

			if (supportedC1P)
			{
				x = jsSelectText(xmlCoverage, ["@c1p"])
				if (x == "none")
				{
					x = notAvailable;
				}
				else
				{
					x = jsPercent(x) + ' (' + jsSelectText(xmlCoverage, ["@branches_c1p_exec"]) + '/' + jsSelectText(xmlCoverage, ["@branches_c1p_total"]) + ')';
				}
				jsApplyText(detailsHtml, "DtlsContSummaryCoverageC1P", x);
			}
			else
			{
				detailsHtml.querySelector("#DtlsContSummaryCoverageTrC1P").style.display = "none";
			}
		}

		if (xmlDataChild.nodeName == "testcases")
		{
			for (var xmlTestcasesEntry=xmlDataChild.firstChild; xmlTestcasesEntry!==null; xmlTestcasesEntry=xmlTestcasesEntry.nextSibling)
			{
				if (xmlTestcasesEntry.nodeName == "testcase")
				{
					// Construct main entry for the testcases table
					var htmlTestCase = htmlDtlsTplTestCase.cloneNode(true);
					htmlTestCase.style.display = "table-row";
					
					jsApplySelect(xmlTestcasesEntry ,["@name"], htmlTestCase, "DtlsContTestCaseName");
					jsApplyText(htmlTestCase, "DtlsContTestCaseResult", resultMap[jsSelectText(xmlTestcasesEntry ,["@result"])]);
					
					htmlDtlsContTestCases.appendChild(htmlTestCase);
				}
			}
		}

		if (xmlDataChild.nodeName == "files")
		{
			for (var xmlCoverageEntry=xmlDataChild.firstChild; xmlCoverageEntry!==null; xmlCoverageEntry=xmlCoverageEntry.nextSibling)
			{
				if (xmlCoverageEntry.nodeName == "file")
				{
				
					var htmlFile = htmlDtlsTplFile.cloneNode(true);
					htmlFile.style.display = "table-row";
					
					jsApplySelect(xmlCoverageEntry ,["@name"], htmlFile, "DtlsContFilename");
					
					if (supportedC0)
					{
						x = jsSelectText(xmlCoverageEntry, ["@c0"])
						if (x == "none")

							x = notAvailable;
						}
						else
						{
							x = jsPercent(x) + ' (' + jsSelectText(xmlCoverageEntry, ["@lines_exec"]) + '/' + jsSelectText(xmlCoverageEntry, ["@lines_total"]) + ')';
						}
						jsApplyText(htmlFile, "DtlsContFileC0", x);

					else
					{
						htmlFile.querySelector("#DtlsContFileC0").style.display="none";
						detailsHtml.querySelector("#DtlsContFileThC0").style.display="none";
					}
						
					if (supportedC1)
					{
						x = jsSelectText(xmlCoverageEntry, ["@c1"])
						if (x == "none")
						{
							x = notAvailable;
						}
						else
						{
							x = jsPercent(x) + ' (' + jsSelectText(xmlCoverageEntry, ["@branches_c1_exec"]) + '/' + jsSelectText(xmlCoverageEntry, ["@branches_c1_total"]) + ')';
						}
						jsApplyText(htmlFile, "DtlsContFileC1", x);
					}
					else
					{
						htmlFile.querySelector("#DtlsContFileC1").style.display="none";
						detailsHtml.querySelector("#DtlsContFileThC1").style.display="none";
					}
						
					if (supportedC1P)
					{
						x = jsSelectText(xmlCoverageEntry, ["@c1p"])
						if (x == "none")
						{
							x = notAvailable;
						}
						else
						{
							x = jsPercent(x) + ' (' + jsSelectText(xmlCoverageEntry, ["@branches_c1p_exec"]) + '/' + jsSelectText(xmlCoverageEntry, ["@branches_c1p_total"]) + ')';
						}
						jsApplyText(htmlFile, "DtlsContFileC1P", x);
					}
					else
					{
						htmlFile.querySelector("#DtlsContFileC1P").style.display="none";
						detailsHtml.querySelector("#DtlsContFileThC1P").style.display="none";
					}
				
					htmlDtlsContFiles.appendChild(htmlFile);
				}
			}
		}

		if (xmlDataChild.nodeName == "output")
		{
			detailsHtml.querySelector("#DtlsContOutputTd").innerText = xmlDataChild.textContent;
		}

	}	

}

{
	jsInitDetails(xmlData, document.getElementById("ContDetails"));
